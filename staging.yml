version: 2

models:
  - name: stg_pos_transactions
    columns:
      - name: pos_transaction_id
        tests: [not_null, unique]
      - name: transaction_date
        tests: [not_null]
      - name: store_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: net_sales
        tests: [not_null]

  - name: stg_billings_invoices
    columns:
      - name: invoice_id
        tests: [not_null]
      - name: invoice_date
        tests: [not_null]
      - name: customer_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: net_amount
        tests: [not_null]
      - name: invoice_status
        tests:
          - accepted_values:
              values: ['PAID', 'OPEN']
